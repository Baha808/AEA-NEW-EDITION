
[core]
@global subPr: 30
@global gui: false
name: DvasT
displayText: Devastator
displayDescription: "S... st... stay away from me!!!"\n-Latest Heavy Armored Experimental mech\nArmed with 2x Devastator Lx78 Auto Cannons supported with hydraulics.\nfires sophisticated timed fuze Large canister shot and\ndischarges numerous small super heated tungsten sub-projectiles\n+25% chance 5 extra sub-projectile|+10% chance 10 sub-projectile (+5 direct|+5 area damage)\n-Ground Attack only\n-Transport slot needed: 5\n-Can traverse on watah\n--------------------------\nWeapon: [2x Devastator Lx78 Auto Cannons], Target: Land\nAccuracy: Good, Ammo: 8, Burst size: 8, Sub-projectile: ${subPr}\nSecWeapon: [NONE]
displayText_ru: Опустошитель
displayDescription_ru: "Я - неприкасаем, неумолим и беспощаден!"\n- Тяжеловооружённый шагоход новейшего типа\n- Оснащён двумя автопушками типа "Опустошитель",\n осуществляющими работу с помощью гидравлики\n- Запускает несколько больших канистр, расщепляющиеся\n на маленькие раскалённые вспомогательные снаряды\n- Канистра имеет шанс разлететься на большее количество вспомогательных снарядов:\n 25% - на доп. 5 снарядов\n 10% - на доп. 10 снарядов\n- Имеет пониженный урон по зданиям и щитам\n- Не может стрелять в радиусе 150 и меньше\n- Может ходить по воде\n- Занимает 5 единиц техники.
displayText_zh: 大力神
displayDescription_zh:“你…你…你不要过来啊！！！”\n-最新型号的重型装甲实验机械，配备2x毁灭者Lx78自动火炮，由液压装置支撑\n-发射精密定时引信大型霰弹并分散出大量小型过热钨子母弹\n-25%几率分散5额外子母弹\n-10%几率分散额外10子母弹（+5直接伤害;+5范围伤害）\n-对护盾单位伤害削减50%，对建筑结构只造成25%伤害，对机体造成110%伤害\n-仅对陆地目标攻击\n-2个内部模块槽，12个模块使用选择\n-被运输需要的空间：5\n-可以在水上移动\n--------------------------------------\n武器：[2门毁灭者Lx78自动加农炮]，目标：陆地单位\n精度：良好\n副武器：[无]

