[core]
showInEditor:false
name: readyController
maxHp: 1
price: 0
mass: 0
radius: 0
ignoreInUnitCapCalculation:true
disableAllUnitCollisions:true
isUnselectable:true
canNotBeDirectlyAttacked:true
canNotBeGivenOrdersByPlayer:true
disableDeathOnZeroHp:true
explodeOnDeath:false
hideScorchMark:true
tags: readyController

[graphics]
image: ROOT:data/null.png
isVisible: false
disableLowHpFire:true
disableLowHpSmoke:true
[attack]
canAttack:false
[movement]
movementType: AIR
targetHeight:0
targetHeightDrift:0

[core]
@memory ccunit:unit[]
@memory playerReady:number[]

[hiddenAction_p0]
@define nr:0
autoTriggerOnEvent: newMessage(withTag="info")
requireConditional: if eventData("id",type="float")==${nr}
setUnitMemory: ccunit[${nr}]=eventSource
debugMessage: msg - ${nr}, %{memory.ccunit[${nr}]}, %{eventSource.teamId}
[hiddenAction_p1]
@copyFromSection: hiddenAction_p0
@define nr: 1
